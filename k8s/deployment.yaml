apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devops-app
  namespace: flask-devops
  labels:
    app: flask-devops-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-devops-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  template:
    metadata:
      labels:
        app: flask-devops-app
    
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: flask-devops-app
          image: ${ECR_REGISTRY}/flask-devops-app:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
