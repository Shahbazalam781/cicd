
name: Flask CI and Multi-Registry Publishing

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Test, Build and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run application tests
      - name: Run pytest
        run: |
          python -m pytest -v

      # 5. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build one image and publish it to both registries
      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          DOCKERHUB_IMAGE="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/flask-devops-app"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "Building Docker image..."

          docker build \
            -t "$DOCKERHUB_IMAGE:latest" \
            -t "$DOCKERHUB_IMAGE:$IMAGE_TAG" \
            -t "$ECR_IMAGE:latest" \
            -t "$ECR_IMAGE:$IMAGE_TAG" \
            .

          echo "Pushing images to Docker Hub..."

          docker push "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:$IMAGE_TAG"

          echo "Pushing images to Amazon ECR..."

          docker push "$ECR_IMAGE:latest"
          docker push "$ECR_IMAGE:$IMAGE_TAG"

          echo "Successfully published images to both registries."
