```yaml
name: Flask CI and Multi-Registry Publishing

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION + PUBLISHING
  # ==========================================

  build-and-publish:
    name: Test, Build and Publish
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run application tests
      - name: Run pytest
        run: |
          python -m pytest -v

      # 5. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build and publish Docker image
      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          DOCKERHUB_IMAGE="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/flask-devops-app"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "Building Docker image..."

          docker build \
            -t "$DOCKERHUB_IMAGE:latest" \
            -t "$DOCKERHUB_IMAGE:$IMAGE_TAG" \
            -t "$ECR_IMAGE:latest" \
            -t "$ECR_IMAGE:$IMAGE_TAG" \
            .

          echo "Pushing images to Docker Hub..."

          docker push "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:$IMAGE_TAG"

          echo "Pushing images to Amazon ECR..."

          docker push "$ECR_IMAGE:latest"
          docker push "$ECR_IMAGE:$IMAGE_TAG"

          echo "Successfully published images to both registries."


  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT TO MINIKUBE
  # ==========================================

  deploy-to-minikube:
    name: Deploy to Minikube

    needs: build-and-publish

    # Never deploy pull requests or untrusted code
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux, X64, minikube]

    steps:

      # 1. Checkout exact source commit
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Automatically determine ECR registry
      - name: Determine ECR registry
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"

          echo "ECR registry configured successfully."

      # 4. Verify Kubernetes access
      - name: Verify Minikube
        run: |
          set -euo pipefail

          kubectl config current-context
          kubectl get nodes

      # 5. Create namespace and refresh ECR pull secret
      - name: Refresh ECR image pull secret
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          kubectl apply -f k8s/namespace.yaml

          ECR_PASSWORD="$(aws ecr get-login-password \
            --region "$AWS_REGION")"

          kubectl create secret docker-registry ecr-registry-secret \
            --namespace flask-devops \
            --docker-server="$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="$ECR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          unset ECR_PASSWORD

          echo "ECR image pull secret refreshed."

      # 6. Deploy exact Git commit image
      - name: Deploy application
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          export IMAGE_TAG

          envsubst '${ECR_REGISTRY} ${IMAGE_TAG}' \
            < k8s/deployment.yaml \
            > /tmp/flask-devops-deployment.yaml

          kubectl apply -f k8s/service.yaml

          kubectl apply \
            -f /tmp/flask-devops-deployment.yaml

          rm -f /tmp/flask-devops-deployment.yaml

          echo "Application deployment submitted."

      # 7. Verify successful Kubernetes rollout
      - name: Verify deployment rollout
        run: |
          set -euo pipefail

          kubectl rollout status deployment/flask-devops-app \
            --namespace flask-devops \
            --timeout=180s

          kubectl get deployments,pods,services \
            --namespace flask-devops

          echo "Minikube deployment completed successfully."
```