
name: Flask CI and Multi-Registry Publishing

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Test, Build and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run application tests
      - name: Run pytest
        run: |
          python -m pytest -v
        

      # 5. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build one image and publish it to both registries
      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          DOCKERHUB_IMAGE="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/flask-devops-app"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "Building Docker image..."

          docker build \
            -t "$DOCKERHUB_IMAGE:latest" \
            -t "$DOCKERHUB_IMAGE:$IMAGE_TAG" \
            -t "$ECR_IMAGE:latest" \
            -t "$ECR_IMAGE:$IMAGE_TAG" \
            .

          echo "Pushing images to Docker Hub..."

          docker push "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:$IMAGE_TAG"

          echo "Pushing images to Amazon ECR..."

          docker push "$ECR_IMAGE:latest"
          docker push "$ECR_IMAGE:$IMAGE_TAG"

          echo "Successfully published images to both registries."

  deploy-to-minikube:
    name: Deploy to Minikube
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, minikube]

    steps:
      # 1. Checkout the exact commit that triggered this workflow
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Verify Kubernetes cluster access
      - name: Verify Minikube
        run: |
          kubectl config current-context
          kubectl get nodes

      # 4. Refresh ECR pull secret
      - name: Refresh ECR image pull secret
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail

          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          kubectl create secret docker-registry ecr-registry-secret \
            --namespace flask-devops \
            --docker-server="$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="$ECR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          unset ECR_PASSWORD

      # 5. Deploy the exact image published by the build job
      - name: Deploy application
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          export ECR_REGISTRY IMAGE_TAG

          envsubst '${ECR_REGISTRY} ${IMAGE_TAG}' \
            < k8s/deployment.yaml \
            > /tmp/flask-devops-deployment.yaml

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f /tmp/flask-devops-deployment.yaml

          rm -f /tmp/flask-devops-deployment.yaml

      # 6. Wait for successful rollout
      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/flask-devops-app \
            --namespace flask-devops \
            --timeout=180s

          kubectl get deployments,pods,services \
            --namespace flask-devops
