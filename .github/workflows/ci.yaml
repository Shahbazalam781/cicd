
name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          python -m pytest -v

  docker-build:
    name: Build and Push to Docker Hub and ECR
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub authentication
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # AWS OIDC authentication 
      - name: Verify AWS Role ARN Variable
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN variable is empty or unavailable"
            exit 1
          fi

          if [[ "$ROLE_ARN" != arn:aws:iam::*:role/GitHubActions-ECR-Push-Role ]]; then
            echo "::error::Unexpected IAM role ARN format"
            exit 1
          fi

          echo "AWS role ARN variable is configured correctly."
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
 
      # Authenticate Docker with AWS ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build once and publish to both registries
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-pipeline:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/devops-cicd-pipeline:latest
            ${{ steps.login-ecr.outputs.registry }}/devops-cicd-pipeline:${{ github.sha }}
