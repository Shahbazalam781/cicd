
name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # Job 1: Run automated application tests
  test:
    name: Run Flask Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  # Job 2: Build and publish Docker image
  docker-build:
    name: Build and Push to Docker Hub and ECR
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub authentication
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # AWS authentication through GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # Verify AWS identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Amazon ECR authentication
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build once and push to both registries
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-cicd-pipeline:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/devops-cicd-pipeline:latest
            ${{ steps.login-ecr.outputs.registry }}/devops-cicd-pipeline:${{ github.sha }}
